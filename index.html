<style>
  :root{
    --bg:#f4f5fb;
    --card:#ffffff;
    --border:#eceefb;
    --text:#181a2a;
    --muted:#8b8fa3;
    --p1:#6c5ce7;
    --p2:#a29bfe;
    --p3:#fd79a8;
    --grad1:linear-gradient(135deg,#6c5ce7 0%,#a29bfe 55%,#fd79a8 100%);
    --grad-warm:linear-gradient(135deg,#ff9a56 0%,#ff6b6b 100%);
    --grad-mint:linear-gradient(135deg,#00cec9 0%,#55efc4 100%);
    --grad-blue:linear-gradient(135deg,#0984e3 0%,#74b9ff 100%);
    --grad-pink:linear-gradient(135deg,#fd79a8 0%,#fdcbf1 100%);
    --grad-purple:linear-gradient(135deg,#6c5ce7 0%,#a29bfe 100%);
    --danger:#ff4757;
    --success:#00b894;
    --radius:20px;
    --shadow-sm:0 2px 8px rgba(24,26,42,0.06);
    --shadow-md:0 8px 24px rgba(108,92,231,0.14);
    --shadow-lg:0 12px 32px rgba(108,92,231,0.22);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0;
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--text);
    overscroll-behavior-y:none;
  }
  .app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
    position:relative;
    padding-bottom:24px;
  }

  /* ---------- HEADER ---------- */
  .hero{
    background:var(--grad1);
    padding:calc(env(safe-area-inset-top) + 22px) 20px 34px;
    border-radius:0 0 32px 32px;
    position:relative;
    overflow:hidden;
    box-shadow:0 8px 30px rgba(108,92,231,0.35);
  }
  .hero::before{
    content:"";
    position:absolute;
    width:220px; height:220px;
    background:rgba(255,255,255,0.12);
    border-radius:50%;
    top:-90px; right:-60px;
  }
  .hero::after{
    content:"";
    position:absolute;
    width:140px; height:140px;
    background:rgba(255,255,255,0.08);
    border-radius:50%;
    bottom:-60px; left:-40px;
  }
  .hero-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    position:relative;
    z-index:2;
  }
  .hero-greet p{
    margin:0;
    color:rgba(255,255,255,0.78);
    font-size:13px;
    font-weight:500;
  }
  .hero-greet h1{
    margin:4px 0 0;
    color:#fff;
    font-size:24px;
    font-weight:800;
    letter-spacing:-0.02em;
  }
  .hero-avatar{
    width:42px; height:42px;
    border-radius:14px;
    background:rgba(255,255,255,0.2);
    backdrop-filter:blur(10px);
    display:flex; align-items:center; justify-content:center;
    font-size:19px;
  }
  .stat-row{
    display:flex;
    gap:10px;
    margin-top:22px;
    position:relative;
    z-index:2;
  }
  .stat-pill{
    flex:1;
    background:rgba(255,255,255,0.16);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.22);
    border-radius:16px;
    padding:12px 14px;
  }
  .stat-pill .num{
    color:#fff;
    font-size:19px;
    font-weight:800;
    line-height:1;
  }
  .stat-pill .lbl{
    color:rgba(255,255,255,0.75);
    font-size:11px;
    font-weight:600;
    margin-top:4px;
  }

  /* ---------- SEARCH ---------- */
  .search-wrap{
    padding:16px 20px 4px;
  }
  .search-box{
    background:var(--card);
    border-radius:16px;
    padding:13px 16px;
    display:flex;
    align-items:center;
    gap:10px;
    box-shadow:var(--shadow-sm);
    border:1px solid var(--border);
  }
  .search-box input{
    border:none;
    outline:none;
    font-size:14px;
    flex:1;
    background:transparent;
    color:var(--text);
  }
  .search-box input::placeholder{color:var(--muted);}
  .search-icon{font-size:16px; opacity:0.5;}

  /* ---------- SECTION ---------- */
  .section{
    padding:18px 20px 0;
  }
  .section-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
  }
  .section-head h2{
    font-size:16px;
    font-weight:800;
    margin:0;
    letter-spacing:-0.01em;
  }
  .section-head span{
    font-size:12px;
    color:var(--p1);
    font-weight:700;
  }

  /* ---------- TOOL GRID ---------- */
  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .tool-card{
    background:var(--card);
    border-radius:18px;
    padding:16px;
    display:flex;
    flex-direction:column;
    box-shadow:var(--shadow-sm);
    border:1px solid var(--border);
    transition:transform .12s ease, box-shadow .12s ease;
    position:relative;
    cursor:pointer;
    text-align:left;
    width:100%;
  }
  .tool-card:active{
    transform:scale(0.97);
  }
  .tool-card:disabled{
    opacity:0.55;
  }
  .tool-icon{
    width:44px; height:44px; min-width:44px;
    border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    font-weight:800;
    font-size:16px;
    color:#fff;
    box-shadow:var(--shadow-sm);
    margin-bottom:12px;
    overflow:hidden;
  }
  .tool-icon img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  .tool-info{width:100%;}
  .tool-name{
    font-size:15px;
    font-weight:700;
    margin:0 0 4px;
    line-height:1.25;
  }
  .tool-desc{
    font-size:12px;
    color:var(--muted);
    font-weight:500;
    line-height:1.4;
    margin:0;
  }
  .btn{cursor:pointer;}
  .btn:active{transform:scale(0.94);}

  /* ---------- ADD CARD ---------- */
  .add-card{
    background:linear-gradient(135deg,rgba(108,92,231,0.06),rgba(253,121,168,0.06));
    border:2px dashed #d7d4f7;
    border-radius:18px;
    padding:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    color:var(--p1);
    font-weight:700;
    font-size:14px;
    margin-top:4px;
  }
  .add-card:active{transform:scale(0.98);}

  /* ---------- EMPTY ---------- */
  .empty{
    text-align:center;
    padding:50px 20px;
    color:var(--muted);
  }
  .empty .emo{font-size:38px; margin-bottom:10px;}
  .empty p{font-size:13px; margin:4px 0 0;}

  /* ---------- FOOTER ---------- */
  .app-footer{
    text-align:center;
    padding:24px 20px 8px;
    font-size:12px;
    color:var(--muted);
  }
  .app-footer a{
    color:var(--muted);
    text-decoration:none;
    font-weight:600;
  }
  .app-footer a:active{
    color:var(--p1);
  }
  .app-footer .dot-sep{
    margin:0 8px;
    color:var(--border);
  }

  /* ---------- SHEET ---------- */
  .overlay{
    position:fixed; inset:0;
    background:rgba(20,16,40,0.5);
    backdrop-filter:blur(2px);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:60;
  }
  .overlay.show{display:flex;}
  .sheet{
    background:#fff;
    width:100%;
    max-width:480px;
    border-radius:26px 26px 0 0;
    padding:18px 20px calc(20px + env(safe-area-inset-bottom));
    max-height:90vh;
    overflow-y:auto;
    animation:slideup .25s cubic-bezier(.2,.9,.3,1);
  }
  @keyframes slideup{
    from{transform:translateY(30px); opacity:0;}
    to{transform:translateY(0); opacity:1;}
  }
  .sheet-handle{
    width:38px; height:5px;
    background:#e6e6f0;
    border-radius:99px;
    margin:0 auto 18px;
  }
  .sheet-title-row{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:18px;
  }
  .sheet-icon{
    width:44px; height:44px;
    border-radius:14px;
    background:var(--grad1);
    display:flex; align-items:center; justify-content:center;
    color:#fff;
    font-size:19px;
  }
  .sheet h2{
    font-size:17px;
    margin:0;
    font-weight:800;
  }
  .sheet .sub{
    font-size:12px;
    color:var(--muted);
    margin-top:2px;
  }
  .field{margin-bottom:16px;}
  .field label{
    display:block;
    font-size:12px;
    font-weight:700;
    color:var(--muted);
    margin-bottom:7px;
    text-transform:uppercase;
    letter-spacing:0.03em;
  }
  .field input[type=text]{
    width:100%;
    padding:13px 14px;
    border:1.5px solid var(--border);
    border-radius:13px;
    font-size:15px;
    background:#fafafe;
    font-weight:600;
    color:var(--text);
  }
  .field input[type=text]:focus{
    outline:none;
    border-color:var(--p2);
    background:#fff;
  }
  .field textarea{
    width:100%;
    padding:13px 14px;
    border:1.5px solid var(--border);
    border-radius:13px;
    font-size:12.5px;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    background:#fafafe;
    min-height:130px;
    resize:vertical;
    color:var(--text);
  }
  .field textarea:focus{
    outline:none;
    border-color:var(--p2);
    background:#fff;
  }
  .color-picker{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .color-dot{
    width:38px; height:38px;
    border-radius:12px;
    border:3px solid transparent;
    cursor:pointer;
  }
  .color-dot.selected{
    border-color:var(--text);
    transform:scale(1.08);
  }
  .hint{
    font-size:11.5px;
    color:var(--muted);
    margin-top:7px;
    line-height:1.5;
  }
  .sheet-actions{
    display:flex;
    gap:10px;
    margin-top:6px;
  }
  .sheet-actions .btn{
    flex:1;
    padding:15px;
    font-size:15px;
    font-weight:700;
    border-radius:14px;
    border:none;
  }
  .btn-secondary{background:#f4f5fb; color:var(--text);}
  .btn-primary{
    background:var(--grad1);
    color:#fff;
    box-shadow:0 6px 16px rgba(108,92,231,0.35);
  }
  .btn-delete{
    width:100%;
    padding:13px;
    background:#fff0f0;
    color:var(--danger);
    border:none;
    border-radius:13px;
    font-size:13px;
    font-weight:700;
    margin-top:14px;
  }

  /* ---------- TOAST ---------- */
  .toast{
    position:fixed;
    top:calc(env(safe-area-inset-top) + 14px);
    left:50%;
    transform:translateX(-50%) translateY(-20px);
    background:#181a2a;
    color:#fff;
    padding:12px 20px;
    border-radius:14px;
    font-size:13px;
    font-weight:600;
    z-index:100;
    opacity:0;
    pointer-events:none;
    transition:all .25s cubic-bezier(.2,.9,.3,1);
    display:flex;
    align-items:center;
    gap:8px;
    box-shadow:0 8px 24px rgba(0,0,0,0.25);
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<div class="app">

  <div class="hero">
    <div class="hero-top">
      <div class="hero-greet">
        <p>Welcome back 👋</p>
        <h1>Tool Hub</h1>
      </div>
      <div class="hero-avatar">🧰</div>
    </div>
    <div class="stat-row">
      <div class="stat-pill">
        <div class="num" id="statTotal">0</div>
        <div class="lbl">Total Tools</div>
      </div>
      <div class="stat-pill">
        <div class="num" id="statReady">0</div>
        <div class="lbl">Ready</div>
      </div>
      <div class="stat-pill">
        <div class="num" id="statPending">0</div>
        <div class="lbl">Pending</div>
      </div>
    </div>
  </div>

  <div class="search-wrap">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Search your tools..." oninput="render()">
    </div>
  </div>

  <div class="section">
    <div class="section-head">
      <h2>Your Tools</h2>
      <span id="toolCountLabel">0 tools</span>
    </div>
    <div class="grid" id="toolGrid"></div>

    <div class="add-card btn" onclick="openSheetForNewSlot()" style="margin-top:12px; margin-bottom:8px;">
      <span style="font-size:18px;">＋</span> Add New Tool
    </div>

    <!-- Ad Network -->
    <div id="container-21bd478ee3b9dc6ead1c1d289c89ca25" style="margin-top:16px;"></div>
  </div>

  <footer class="app-footer">
    <a href="about.html">About Us</a>
    <span class="dot-sep">•</span>
    <a href="contact.html">Contact Us</a>
    <span class="dot-sep">•</span>
    <a href="privacy.html">Privacy Policy</a>
  </footer>

</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title-row">
      <div class="sheet-icon" id="sheetIconPreview">🛠️</div>
      <div>
        <h2 id="sheetTitle">Add Tool</h2>
        <div class="sub">Fill in the details below</div>
      </div>
    </div>

    <div class="field">
      <label>Tool Name</label>
      <input type="text" id="toolNameInput" placeholder="e.g. Tool 1">
    </div>

    <div class="field">
      <label>Card Color</label>
      <div class="color-picker" id="colorPicker"></div>
    </div>

    <div class="field">
      <label>Tool File (Base64)</label>
      <textarea id="toolCodeInput" placeholder="Paste your base64-encoded HTML here"></textarea>
      <div class="hint">Convert your tool's HTML file to Base64 and paste the full string here. It'll open instantly in a new tab when tapped.</div>
    </div>

    <div class="sheet-actions">
      <button class="btn btn-secondary" onclick="closeSheet()">Cancel</button>
      <button class="btn btn-primary" onclick="saveTool()">Save Tool</button>
    </div>

    <button class="btn-delete btn" id="deleteBtn" style="display:none;" onclick="deleteTool()">🗑️ Delete This Tool</button>
  </div>
</div>

<div class="toast" id="toast"></div>

      color: "pink",
      locked: true
    },

  /* ====================================================================== */

  const STORAGE_KEY = "my_toolbox_v2";
  const COLORS = [
    { key:'purple', grad:'linear-gradient(135deg,#6c5ce7,#a29bfe)' },
    { key:'warm',   grad:'linear-gradient(135deg,#ff9a56,#ff6b6b)' },
    { key:'mint',   grad:'linear-gradient(135deg,#00cec9,#55efc4)' },
    { key:'blue',   grad:'linear-gradient(135deg,#0984e3,#74b9ff)' },
    { key:'pink',   grad:'linear-gradient(135deg,#fd79a8,#fdcbf1)' },
  ];

  let tools = [];
  let editingIndex = null;
  let selectedColor = COLORS[0].key;

  function loadTools(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      // Agar pehle se edit karke browser me save kiya hua data hai, wahi use hoga.
      // Warna seedha upar wale HARDCODED_TOOLS se load hoga.
      tools = raw ? JSON.parse(raw) : JSON.parse(JSON.stringify(HARDCODED_TOOLS));
    }catch(e){
      tools = JSON.parse(JSON.stringify(HARDCODED_TOOLS));
    }
  }

  function persist(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(tools)); }

  function colorGrad(key){
    const c = COLORS.find(c => c.key === key);
    return c ? c.grad : COLORS[0].grad;
  }

  function render(){
    const grid = document.getElementById('toolGrid');
    const q = (document.getElementById('searchInput').value || "").toLowerCase();
    const filtered = tools
      .map((t, i) => ({...t, _i:i}))
      .filter(t => (t.name || "").toLowerCase().includes(q));

    const total = tools.length;
    const ready = tools.filter(t => t.code && t.code.trim()).length;
    document.getElementById('statTotal').textContent = total;
    document.getElementById('statReady').textContent = ready;
    document.getElementById('statPending').textContent = total - ready;
    document.getElementById('toolCountLabel').textContent = total + (total === 1 ? " tool" : " tools");

    if(filtered.length === 0){
      grid.innerHTML = `<div class="empty"><div class="emo">🔍</div>No tools found<p>Try a different search or add a new tool</p></div>`;
      return;
    }

    grid.innerHTML = filtered.map(t => {
      const hasCode = t.code && t.code.trim().length > 0;
      const initials = (t.name || "T").trim().slice(0,2).toUpperCase();
      const iconHtml = t.icon
        ? `<img src="${t.icon}" alt="${escapeHtml(t.name || '')}">`
        : initials;
      return `
        <button class="btn tool-card" ${hasCode ? '' : 'disabled'} onclick="openTool(${t._i})">
          <div class="tool-icon" style="background:${colorGrad(t.color)}">${iconHtml}</div>
          <div class="tool-info">
            <p class="tool-name">${escapeHtml(t.name || "Untitled Tool")}</p>
            <p class="tool-desc">${escapeHtml(t.desc || (hasCode ? 'Tap to open' : 'Not added yet'))}</p>
          </div>
        </button>
      `;
    }).join("");
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function openTool(index){
    const t = tools[index];
    if(!t || !t.code || !t.code.trim()){ showToast("⚠️ No file added yet"); return; }
    try{
      const cleanBase64 = t.code.trim().replace(/^data:.*;base64,/, "").replace(/\s/g, "");
      const decoded = decodeURIComponent(escape(atob(cleanBase64))); // handles UTF-8 content too
      const blob = new Blob([decoded], { type:"text/html" });
      const url = URL.createObjectURL(blob);
      const newTab = window.open(url, "_blank");
      if(!newTab){
        showToast("⚠️ Popup blocked — allow popups for this site");
      }
    }catch(e){
      try{
        // fallback if UTF-8 decode fails
        const cleanBase64 = t.code.trim().replace(/^data:.*;base64,/, "").replace(/\s/g, "");
        const decoded = atob(cleanBase64);
        const blob = new Blob([decoded], { type:"text/html" });
        const url = URL.createObjectURL(blob);
        window.open(url, "_blank");
      }catch(e2){
        showToast("⚠️ Invalid Base64 code");
      }
    }
  }

  function renderColorPicker(){
    const wrap = document.getElementById('colorPicker');
    wrap.innerHTML = COLORS.map(c => `
      <div class="color-dot ${c.key === selectedColor ? 'selected' : ''}"
           style="background:${c.grad}"
           onclick="selectColor('${c.key}')"></div>
    `).join("");
  }

  function selectColor(key){
    selectedColor = key;
    renderColorPicker();
    document.getElementById('sheetIconPreview').style.background = colorGrad(key);
  }

  function openSheetForNewSlot(){
    editingIndex = tools.length;
    selectedColor = COLORS[tools.length % COLORS.length].key;
    document.getElementById('sheetTitle').textContent = "Add Tool";
    document.getElementById('toolNameInput').value = "Tool " + (tools.length + 1);
    document.getElementById('toolCodeInput').value = "";
    document.getElementById('deleteBtn').style.display = "none";
    document.getElementById('sheetIconPreview').style.background = colorGrad(selectedColor);
    renderColorPicker();
    document.getElementById('overlay').classList.add('show');
  }

  function openSheetForEdit(index){
    const existing = tools[index];
    if(existing && existing.locked){
      showToast("🔒 This tool is fixed in the code and can't be edited here");
      return;
    }
    editingIndex = index;
    const t = tools[index];
    selectedColor = t.color || COLORS[0].key;
    document.getElementById('sheetTitle').textContent = "Edit Tool";
    document.getElementById('toolNameInput').value = t.name || "";
    document.getElementById('toolCodeInput').value = t.code || "";
    document.getElementById('deleteBtn').style.display = "block";
    document.getElementById('sheetIconPreview').style.background = colorGrad(selectedColor);
    renderColorPicker();
    document.getElementById('overlay').classList.add('show');
  }

  function closeSheet(){
    document.getElementById('overlay').classList.remove('show');
    editingIndex = null;
  }

  function saveTool(){
    const name = document.getElementById('toolNameInput').value.trim() || "Untitled Tool";
    const code = document.getElementById('toolCodeInput').value.trim();
    if(editingIndex === null) return;
    if(tools[editingIndex] && tools[editingIndex].locked) return; // extra safety
    tools[editingIndex] = { name, code, color:selectedColor, locked:false };
    persist();
    render();
    closeSheet();
    showToast("✓ Tool saved successfully");
  }

  function deleteTool(){
    if(editingIndex === null) return;
    if(tools[editingIndex] && tools[editingIndex].locked) return; // extra safety
    tools.splice(editingIndex, 1);
    persist();
    render();
    closeSheet();
    showToast("🗑️ Tool deleted");
  }

  let toastTimer;
  function showToast(msg){
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
  }

  document.getElementById('overlay').addEventListener('click', (e) => {
    if(e.target.id === 'overlay') closeSheet();
  });

  loadTools();
  render();
</script>
